<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KRN frontend browser fixture</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2ff; }
      main { width: min(32rem, calc(100% - 2rem)); padding: 2rem; border-radius: 1rem; background: white; box-shadow: 0 1rem 3rem #1e1b4b22; }
      button { padding: .75rem 1rem; border: 0; border-radius: .5rem; background: #4338ca; color: white; font: inherit; cursor: pointer; }
      [data-testid="task-status"] { min-height: 1.5rem; margin: 1rem 0; }
      [data-testid="task-status"][data-state="complete"] { color: #166534; font-weight: 700; }
    </style>
  </head>
  <body>
    <main data-testid="task-card">
      <h1>Frontend browser fixture</h1>
      <p>Complete the task to prove a ref-based interaction and evidence capture.</p>
      <p data-testid="task-status" data-state="pending" role="status" aria-live="polite">Task pending</p>
      <button data-testid="complete-task" type="button">Complete task</button>
    </main>
    <script>
      document.querySelector('[data-testid="complete-task"]').addEventListener('click', async () => {
        const response = await fetch('/api/interaction');
        if (!response.ok) throw new Error('fixture API failed');
        const status = document.querySelector('[data-testid="task-status"]');
        status.dataset.state = 'complete';
        status.textContent = 'Task complete';
        console.info('fixture task completed');
      });
    </script>
  </body>
</html>
