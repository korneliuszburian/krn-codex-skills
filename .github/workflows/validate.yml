name: validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate contracts and routing
        run: npm run validate
      - name: Test validator falsifiers
        run: npm run test:validate
      - name: Test experiment seal
        run: npm run test:seal
      - name: Test experiment artifacts
        run: npm run test:experiments
      - name: Verify experiment artifacts
        run: npm run verify:experiments
      - name: Test catalog
        run: npm run test:catalog
      - name: Test installer
        run: npm run test:install
      - name: Test hooks
        run: npm run test:hooks
      - name: Test repository setup
        run: npm run test:setup
      - name: Test second-opinion transport
        run: npm run test:second-opinion
      - name: Test reviewer benchmark scorer
        run: npm run test:benchmark
      - name: Check shell and diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bash -n scripts/install.sh
          git diff --check "$BASE_SHA...HEAD"
